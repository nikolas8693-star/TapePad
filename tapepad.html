<style>

 background:
  linear-gradient(180deg,rgba(255,255,255,.38) 0,rgba(255,255,255,0) 16%,rgba(0,0,0,0) 72%,rgba(0,0,0,.24) 100%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,rgba(0,0,0,.035) 1px,rgba(0,0,0,.035) 2px),
  var(--body);
 box-shadow:0 34px 60px rgba(0,0,0,.6),0 0 0 2px rgba(0,0,0,.4),inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.35)}
#wm{position:absolute;left:150px;top:18px;width:260px;height:56px;line-height:56px;font-size:31px;font-weight:800;font-style:italic;letter-spacing:7px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.45),0 -1px 0 rgba(0,0,0,.25);cursor:pointer}

#hlab{position:absolute;left:730px;top:8px;width:84px;text-align:center;font-size:10px;font-weight:700;letter-spacing:3px;color:var(--ink);opacity:.65}

#hold i:after{content:"";position:absolute;left:14px;top:6px;width:14px;height:16px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0,rgba(0,0,0,.35) 2px,transparent 2px,transparent 4px)}

#eng{position:absolute;left:615px;top:262px;width:420px;height:20px;text-align:center;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:6px;color:var(--ink);opacity:.5;transform:rotate(90deg)}

#pc{flex:none;width:60px;height:60px;border-radius:6px;margin-right:16px;background:#2a2c30 center/cover no-repeat;display:none}

#pt{font-size:22px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.fi{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var A=$('au');
var S={songs:[],pls:[]},W={sc:100,body:0,acc:0,tt:1};
var BODIES=[['Grigio chiaro','#d4d5d8'],['Antracite','#2c2e32'],['Verde chiaro','#c5f7c3'],['Verde scuro','#004e48'],['Giallo','#faff79'],['Rosa','#efbfe2'],['Viola scuro','#312232']];
var ACCS=[['Rosso','#d9432f'],['Blu','#2f6fd1'],['Verde','#2f9a55'],['Arancio','#ef8a1f'],['Nero','#2b2b2e']];
var SIZES=[60,70,80,90,100,110,120];
var mem={},db=null,Q=[],qi=0,url=null,unlocked=false,stack=[],locked=false,stopped=true,menuOpen=false;
var seekDir=0,seekT=null,seekI=null,tt=null,pk=null;

/* ---- salvataggio (chiavi proprie di TapePad, separate da VintagePod) ---- */
function libLoad(){try{var o=JSON.parse(localStorage.getItem('tpl')||'null');if(o){S.songs=o.songs||[];S.pls=o.pls||[]}}catch(e){}}
function libSave(){var o={};try{o=JSON.parse(localStorage.getItem('tpl')||'{}')||{}}catch(e){o={}}o.songs=S.songs;o.pls=S.pls;try{localStorage.setItem('tpl',JSON.stringify(o))}catch(e){}}
function save(){libSave()}
function setLoad(){try{var o=JSON.parse(localStorage.getItem('tpw')||'null');if(o)for(var k in o)W[k]=o[k]}catch(e){}}
function setSave(){try{localStorage.setItem('tpw',JSON.stringify(W))}catch(e){}}

/* ---- IndexedDB per i brani ---- */
function openDB(cb){try{var q=indexedDB.open('tp',1);q.onupgradeneeded=function(){q.result.createObjectStore('b')};
 q.onsuccess=function(){db=q.result;cb()};q.onerror=function(){cb()}}catch(e){cb()}}
function put(id,b,cb){if(!db){mem[id]=b;return cb()}var t=db.transaction('b','readwrite');t.objectStore('b').put(b,id);t.oncomplete=cb;t.onerror=cb}
function get(id,cb){if(!db)return cb(mem[id]);var r=db.transaction('b').objectStore('b').get(id);r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb()}}
function delKey(k){delete mem[k];if(db){try{db.transaction('b','readwrite').objectStore('b').delete(k)}catch(e){}}}
function clearAll(){mem={};if(db){try{db.transaction('b','readwrite').objectStore('b').clear()}catch(e){}}}

/* ---- utilita ---- */
var MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',mp4:'audio/mp4',flac:'audio/flac',ogg:'audio/ogg'};
function ext(n){var m=/\.([a-z0-9]+)$/i.exec(n);return m?m[1].toLowerCase():''}
function title(n){n=n.replace(/^.*\//,'');if(MIME[ext(n)])n=n.replace(/\.[^.]+$/,'');return n.replace(/^\d+\s*[-._]\s*/,'')}
function byId(id){for(var i=0;i<S.songs.length;i++)if(S.songs[i].id==id)return S.songs[i]}
function fmt(t){t=Math.floor(t||0);return ('0'+Math.floor(t/60)).slice(-2)+':'+('0'+t%60).slice(-2)}
function cut(t,n){t=t||'';return t.length>n?t.substr(0,n-1)+'…':t}
function lum(h){return .299*parseInt(h.substr(1,2),16)+.587*parseInt(h.substr(3,2),16)+.114*parseInt(h.substr(5,2),16)}
function cl(el,c,on){if(on)el.classList.add(c);else el.classList.remove(c)}
var uid=0;function nid(){return 's'+Date.now()+'_'+(uid++)}
function nkey(t){t=(t||'').toLowerCase();try{t=t.normalize('NFD').replace(/[̀-ͯ]/g,'')}catch(e){}return t.replace(/^[^a-z0-9]+/,'')}
function cmpS(A1,B1){var x=nkey(A1.t).match(/\d+|\D+/g)||[],y=nkey(B1.t).match(/\d+|\D+/g)||[];
 for(var i=0;i<Math.min(x.length,y.length);i++){var p=x[i],q=y[i];
  if(/^\d/.test(p)&&/^\d/.test(q)){var d=parseInt(p,10)-parseInt(q,10);if(d)return d}
  else if(p!==q)return p<q?-1:1}
 return x.length-y.length}
function sortIds(ids){return ids.filter(byId).sort(function(a,b){return cmpS(byId(a),byId(b))})}
function allIds(){return S.songs.map(function(s){return s.id})}
function sortedIds(){return sortIds(allIds())}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function toast(m){var e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show')},1100)}

/* ---- aspetto ---- */
function fit(){var k=Math.min(window.innerWidth/950,window.innerHeight/650)*W.sc/100,s=$('stage').style;s.transform='scale('+k+')';s.webkitTransform='scale('+k+')'}
function apply(){var r=document.documentElement.style,b=BODIES[W.body]||BODIES[0],a=ACCS[W.acc]||ACCS[0];
 r.setProperty('--body',b[1]);r.setProperty('--ink',lum(b[1])>140?'#383a3f':'#e6e6e8');r.setProperty('--acc',a[1]);
 $('stripe').setAttribute('fill',a[1]);fit();setLabel()}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,250)});

/* ---- bobine ---- */
var vel=0,aL=0,aR=0,lastT=0,raf=0,rl=50,rr=26;
function loop(){raf=0;var t=Date.now(),dt=Math.min(.06,(t-lastT)/1000);lastT=t;
 var tv=seekDir?seekDir*6:(A.paused?0:1);vel+=(tv-vel)*Math.min(1,dt*5);
 aL=(aL-vel*dt*9880/rl)%360;aR=(aR-vel*dt*9880/rr)%360;
 $('hl').setAttribute('transform','rotate('+aL.toFixed(1)+')');$('hr').setAttribute('transform','rotate('+aR.toFixed(1)+')');
